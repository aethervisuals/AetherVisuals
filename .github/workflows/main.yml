name: Unpack Template
on: [workflow_dispatch]
jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o aethervisuals-template-1.21.4.zip
          mv aethervisuals-template-1.21.4/* .
          mv aethervisuals-template-1.21.4/.[!.]* . || true
          rm -rf aethervisuals-template-1.21.4 aethervisuals-template-1.21.4.zip
      - run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git commit -m "Unpack template"
          git push
          

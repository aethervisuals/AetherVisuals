name: Build AetherVisuals
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: |
          rm -rf src/main/java/com/aether/aethervisuals/ui/aethervisuals
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: AetherVisuals-1.21.4
          path: build/libs/*.jar
          

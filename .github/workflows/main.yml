name: Unpack Template
on: [workflow_dispatch]
jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o aethervisuals-template-1.21.4.zip
          rm -f aethervisuals-template-1.21.4.zip
          rm -f .github/workflows/build.yml
          
      - run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git commit -m "Unpack template"
          git push
          
